# El juego vive en dos sitios a la vez: GitHub Pages (que se publica solo al
# hacer push) y Cloudflare Pages, en https://santa-perdida.pages.dev
#
# Esto sube la copia de Cloudflare en cada push, para que las dos no se
# separen. Si no esta puesta la clave CLOUDFLARE_API_TOKEN, el trabajo se
# salta entero y no sale ningun aspa roja: hasta entonces, la copia de
# Cloudflare se sube a mano con
#   npx wrangler pages deploy . --project-name santa-perdida

name: Publicar en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    # sin clave no hay nada que hacer, y mejor saltarlo que fallar
    if: ${{ vars.CLOUDFLARE_LISTO == 'si' }}
    steps:
      - uses: actions/checkout@v4

      # Solo se sube lo que el navegador necesita. Los cuadernos de ideas y el
      # servidor de pruebas se quedan en el repositorio, no en la web.
      - name: Juntar lo que se publica
        run: |
          mkdir -p publicar
          cp index.html publicar/
          cp -r src vendor fonts publicar/

      - name: Subir a Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publicar --project-name santa-perdida --branch main
